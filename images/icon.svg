<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset=".5" stop-color="#1c1f24"/><stop offset="1" stop-color="#121417"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25282e"/><stop offset="1" stop-color="#16181c"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#202328"/><stop offset="1" stop-color="#2a2e34"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#5dffa0" stop-opacity=".9"/><stop offset="1" stop-color="#5dffa0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#ffbf3a" stop-opacity=".9"/><stop offset="1" stop-color="#ffbf3a" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#14181E"/>
    <!-- soft sun light from the top -->
    
    <g filter="url(#sh)">
      <!-- main housing -->
      <rect x="58" y="130" width="396" height="252" rx="22" fill="url(#body)"/>
      <!-- right module -->
      <rect x="352" y="134" width="98" height="244" rx="18" fill="url(#side)"/>
      <line x1="352" y1="140" x2="352" y2="372" stroke="#0b0c0e" stroke-width="3"/>
      <!-- hinged lid -->
      <path d="M80 236 H336 V352 Q336 366 322 366 H94 Q80 366 80 352 Z" fill="url(#lid)" stroke="#0c0d10" stroke-width="2.5"/>
      <rect x="92" y="236" width="232" height="10" fill="#0e1013"/>
      <path d="M128 246 V300 H188 V246" fill="none" stroke="#0c0d10" stroke-width="2.5"/>
      <path d="M224 246 V300 H290 V246" fill="none" stroke="#0c0d10" stroke-width="2.5"/>
      <rect x="66" y="252" width="14" height="40" rx="4" fill="#101215"/>
      <rect x="336" y="252" width="14" height="40" rx="4" fill="#101215"/>
      <!-- screw -->
      <circle cx="254" cy="330" r="10" fill="#0f1114" stroke="#3a3e45" stroke-width="2"/>
      <line x1="248" y1="330" x2="260" y2="330" stroke="#4a4f57" stroke-width="2.5"/>
      <!-- shine -->
      <rect x="58" y="130" width="396" height="252" rx="22" fill="url(#shine)"/>
      <!-- logo spot: a small sun instead of a brand name -->
      <g transform="translate(112 178)">
        <circle r="13" fill="none" stroke="#ffb52e" stroke-width="5"/>
        <g stroke="#ffb52e" stroke-width="4.5" stroke-linecap="round">
          <line x1="0" y1="-24" x2="0" y2="-19"/><line x1="0" y1="24" x2="0" y2="19"/>
          <line x1="-24" y1="0" x2="-19" y2="0"/><line x1="24" y1="0" x2="19" y2="0"/>
          <line x1="-17" y1="-17" x2="-13.5" y2="-13.5"/><line x1="17" y1="17" x2="13.5" y2="13.5"/>
          <line x1="-17" y1="17" x2="-13.5" y2="13.5"/><line x1="17" y1="-17" x2="13.5" y2="-13.5"/>
        </g>
      </g>
      <rect x="146" y="170" width="112" height="16" rx="8" fill="#3a3f47"/>
      <!-- LEDs with glow -->
      <circle cx="380" cy="166" r="26" fill="url(#g1)"/>
      <circle cx="380" cy="166" r="7" fill="#7dffb4"/>
      <circle cx="380" cy="200" r="26" fill="url(#g1)"/>
      <circle cx="380" cy="200" r="7" fill="#7dffb4"/>
      <circle cx="380" cy="246" r="26" fill="url(#g2)"/>
      <circle cx="380" cy="246" r="7" fill="#ffd27a"/>
      <circle cx="380" cy="280" r="26" fill="url(#g1)"/>
      <circle cx="380" cy="280" r="7" fill="#7dffb4"/>
      <!-- icons next to LEDs -->
      <g fill="none" stroke="#8a919c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M408 170 q0-10 9-10 q3-7 11-5 q8 1 8 9 q6 1 6 6 q0 6-7 6 h-21 q-6 0-6-6z"/>
        <path d="M410 194 h18 v12 h-18z M410 200 h18"/>
        <path d="M420 238 l-6 10 h8 l-6 10"/>
        <path d="M410 270 h18 l-5-5 M428 284 h-18 l5 5"/>
      </g>
      <!-- USB ports -->
      <rect x="392" y="320" width="40" height="20" rx="4" fill="#0b0c0f" stroke="#3b4048" stroke-width="2"/>
      <rect x="400" y="326" width="24" height="8" rx="1.5" fill="#2d3138"/>
      <rect x="392" y="346" width="40" height="20" rx="4" fill="#0b0c0f" stroke="#3b4048" stroke-width="2"/>
      <rect x="400" y="352" width="24" height="8" rx="1.5" fill="#2d3138"/>
    </g>
    <!-- amber strip like the Easee light strip -->
    <rect x="58" y="410" width="396" height="10" rx="5" fill="#ffb52e"/>
    <rect x="58" y="410" width="396" height="10" rx="5" fill="#ffb52e" opacity=".5" filter="url(#sh)"/>
  </g>
</svg>
