name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/enphase_envoy_local/manifest.json > m.json
          mv m.json custom_components/enphase_envoy_local/manifest.json
      - name: Build zip
        run: cd custom_components/enphase_envoy_local && zip -r ../../enphase_envoy_local.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: enphase_envoy_local.zip
